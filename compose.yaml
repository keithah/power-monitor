services:
  solar-power-monitor:
    build: .
    container_name: solar-power-monitor
    restart: unless-stopped
    ports:
      - "8094:8080"
    env_file:
      - .env
    environment:
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-900}
    volumes:
      - solar_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  solar_data:
