version: 2
project_name: power-monitor-pp-cli
changelog:
  disable: true
builds:
  - id: power-monitor-pp-cli
    main: ./cmd/power-monitor-pp-cli
    binary: power-monitor-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X power-monitor-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: power-monitor-pp-mcp
    main: ./cmd/power-monitor-pp-mcp
    binary: power-monitor-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: power-monitor-pp-cli
    repository:
      owner: keithah
      name: homebrew-tap
    homepage: "https://github.com/keithah/power-monitor-pp-cli"
    description: "PG&E/Opower, Enphase, Emporia electricity monitoring"
    install: |
      bin.install "power-monitor-pp-cli"
      bin.install "power-monitor-pp-mcp"
